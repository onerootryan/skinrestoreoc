[build]
  command = "npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "22"

# Force HTTPS + canonical host (fixes the http://www duplicate found in the audit)
[[redirects]]
  from = "https://skinrestoreoc.com/*"
  to = "https://www.skinrestoreoc.com/:splat"
  status = 301
  force = true

# Retired Square product + shop URLs -> 404 deliberately (zero traffic, zero backlinks)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old Square Online booking path -> Square Appointments, so bookmarks,
# old Google results and Instagram bio links keep working after cutover.
[[redirects]]
  from = "/s/appointments"
  to = "https://book.squareup.com/appointments/iqeoshu0dfmonc/location/LRDN4QX13C2V0/services"
  status = 301
  force = true

# Short, memorable link for business cards, texts and Instagram: skinrestoreoc.com/book
[[redirects]]
  from = "/book"
  to = "https://book.squareup.com/appointments/iqeoshu0dfmonc/location/LRDN4QX13C2V0/services"
  status = 302

# Services and Treatments are now one page. /services was live on the old Square
# site (and crawled), so send it — and any old links to it — to /treatments.
[[redirects]]
  from = "/services"
  to = "/treatments"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Ahrefs crawl fixes
# ---------------------------------------------------------------------------

# The old Square site used /contact-us; the new page is /contact.
[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
  force = true

# Astro emits sitemap-index.xml; /sitemap.xml is what tools and people try.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Build output is .html files, but the public URLs are extensionless.
# Without these, every page is reachable at two URLs (duplicate content).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

